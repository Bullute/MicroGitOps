replicaCount: 2

image:
  repository: microgitops
  tag: v2
  pullPolicy: IfNotPresent

service:
  type: ClusterIP
  port: 8000

ingress:
  enabled: true
  className: "traefik"
  host: "microgitops.local"

hpa:
  enabled: true
  minReplicas: 2
  maxReplicas: 10
  targetCPUUtilizationPercentage: 65
  targetMemoryUtilizationPercentage: 80

resources:
  limits:
    cpu: 400m
    memory: 256Mi
  requests:
    cpu: 200m
    memory: 64Mi

serviceMonitor:
  enabled: true
  interval: 15s
  path: /metrics
