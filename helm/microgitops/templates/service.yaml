apiVersion: v1
kind: Service
metadata:
  name: {{ include "microgitops.fullname" . }}
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "microgitops.labels" . | nindent 4 }}
spec:
  type: {{ .Values.service.type }}
  ports:
    - port: {{ .Values.service.port }}
      targetPort: 8000
      protocol: TCP
      name: http
  selector:
    {{- include "microgitops.selectorLabels" . | nindent 4 }}
