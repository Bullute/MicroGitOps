apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "microgitops.fullname" . }}
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "microgitops.labels" . | nindent 4 }}
spec:
  replicas: {{ .Values.replicaCount }}
  selector:
    matchLabels:
      {{- include "microgitops.selectorLabels" . | nindent 6 }}
  template:
    metadata:
      labels:
        {{- include "microgitops.selectorLabels" . | nindent 8 }}
    spec:
      # Hardening: Run as same non-root user UID 10001
      securityContext:
        runAsUser: 10001
        runAsGroup: 10001
        fsGroup: 10001
      containers:
        - name: {{ .Chart.Name }}
          image: "{{ .Values.image.repository }}:{{ .Values.image.tag }}"
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          ports:
            - name: http
              containerPort: 8000
              protocol: TCP
          # Load environments from Terraform-managed ConfigMap and Secret
          envFrom:
            - configMapRef:
                name: microgitops-config
            - secretRef:
                name: microgitops-secret
          livenessProbe:
            httpGet:
              path: /health
              port: 8000
            initialDelaySeconds: 5
            periodSeconds: 10
          readinessProbe:
            httpGet:
              path: /health
              port: 8000
            initialDelaySeconds: 5
            periodSeconds: 10
          resources:
            {{- toYaml .Values.resources | nindent 12 }}
