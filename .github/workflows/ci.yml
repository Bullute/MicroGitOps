name: MicroGitOps CI Pipeline

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  # Job 1: Check Python code quality (Linting)
  lint:
    name: Code Quality check
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install Linting dependencies
        run: |
          python -m pip install --upgrade pip
          pip install ruff

      - name: Run Ruff Linter
        run: ruff check .

  # Job 2: Security & Build Phase
  security-and-build:
    name: Build & Scan Container Image
    runs-on: ubuntu-latest
    needs: lint
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      # Build the image locally first for scanning
      - name: Build Local Image for Scanning
        run: |
          docker build -t microgitops:${{ github.sha }} .

      # Use Trivy to scan the built image for security vulnerabilities
      - name: Run Trivy Vulnerability Scanner
        uses: aquasecurity/trivy-action@0.24.0
        with:
          image-ref: 'microgitops:${{ github.sha }}'
          format: 'table'
          exit-code: '1' # Fail pipeline if HIGH or CRITICAL issues are discovered
          ignore-unfixed: true
          severity: 'HIGH,CRITICAL'
