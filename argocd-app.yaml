apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: microgitops-app
  namespace: argocd
spec:
  project: default
  source:
    repoURL: 'https://github.com/Bullute/project-2.git'
    targetRevision: HEAD
    path: helm/microgitops
    helm:
      valueFiles:
        - values.yaml
  destination:
    server: 'https://kubernetes.default.svc'
    namespace: microgitops
  ignoreDifferences:
    - group: apps
      kind: Deployment
      jsonPointers:
        - /spec/replicas
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - CreateNamespace=false # Already created by Terraform
